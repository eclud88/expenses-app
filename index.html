<style>
:root{

@media (prefers-color-scheme:dark){:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}

.wrap{max-width:760px;margin:0 auto;padding:0 14px}

.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--gold)}
.logo{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800}
.clock{text-align:right;line-height:1.15}
#cdate{font-size:12px;color:#d6dbe6}
#ctime{font-size:19px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
main.wrap{padding-top:14px;padding-bottom:calc(160px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:2px 0 12px;color:var(--text)}
h2{font-size:13px;margin:22px 2px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.muted{color:var(--muted);font-size:14px}.c{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px}
.pad{padding:14px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}

.total .trow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.total .lbl{font-size:13px;color:#cdd5e4}

.tright{text-align:right;font-size:13px;color:#cdd5e4}.tright .vsv{font-size:18px;font-weight:700}.tright .dl{color:#fff}
.tbud{margin-top:12px}
.total .dl.up{color:#ffb38a}.total .dl.dn{color:#86efac}
.prefs{display:flex;flex-wrap:wrap;gap:6px 18px;margin:2px 2px 12px}

.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-left:4px solid var(--gold);font-size:14px}
.banner .nm{flex:1}
details>summary{list-style:none;cursor:pointer}

details.cat{border-left:5px solid var(--cc,var(--gold))}

details.cat[open]>summary::after{transform:rotate(90deg)}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--cc,var(--gold)) 20%,transparent);flex:none}
.ic.sm{width:24px;height:24px;font-size:14px;border-radius:7px}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.amtw{text-align:right}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}.amt.zero{color:var(--muted);font-weight:400}
.cmpl{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.dl{font-size:12px;font-weight:700;white-space:nowrap}.dl.up{color:var(--up)}.dl.dn{color:var(--dn)}.dl.eq{color:var(--muted)}

.bud.warn i{background:#f59e0b}.bud.over i{background:var(--up)}
.budtxt{flex-basis:100%;order:4;font-size:12px;font-weight:400;color:var(--muted);margin-top:-4px}

.plus{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--on-gold);font-size:22px;font-weight:700;line-height:1;flex:none}

.en{flex:1;min-width:0}.it{overflow-wrap:anywhere}.dt{font-size:12px;color:var(--muted)}
.ea{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
ul.entries button{width:34px;height:34px;border-radius:8px;color:var(--muted)}
.empty{padding:2px 16px 12px 20px;color:var(--muted);font-size:14px}
.emptybox{padding:28px 16px;text-align:center;color:var(--muted)}

.seg button.on{background:var(--gold);color:var(--on-gold)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-top:3px solid var(--gold)}
.kl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ks{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ctitle{font-size:15px;font-weight:700;margin:0 0 10px}
.chart{width:100%;height:auto;display:block}

.chart .hit{fill:transparent;cursor:pointer}.chart .hit.sel{fill:var(--selfill)}
.chart .dc1{fill:var(--text);font-size:17px;font-weight:800}.chart .dc2{fill:var(--muted);font-size:10px}
.readout{margin-top:8px;padding:10px 12px;background:var(--field);border-radius:10px;font-size:14px}
.donutwrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.donut{width:200px;height:200px}
.legend{width:100%}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;border-top:1px solid var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:6px 10px;border-radius:16px;background:var(--field);font-size:13px;border:1px solid var(--line)}
.legchips{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}
.legchips .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.hb .hbr{margin:9px 0}.hbl{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:3px}
.trk{height:9px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:2px}.trk i{display:block;height:100%;border-radius:5px}
.trk.prev i{background:#7a869a;opacity:.7}.hbl .pv{font-size:12px;color:var(--muted)}
.ins{margin:0;padding:0;list-style:none}.ins li{padding:9px 0;border-top:1px solid var(--line);font-size:14px}.ins li:first-child{border-top:0}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:150px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
thead th{background:var(--navy);color:var(--gold);position:sticky;top:0;z-index:2}
thead th:first-child{z-index:3;background:var(--navy)}
tr.catrow td{font-weight:700;background:var(--field);cursor:pointer;border-top:2px solid var(--cc,var(--gold))}
tr.catrow td:first-child{background:var(--field)}
tr.subrow td:first-child{padding-left:22px}
tr.grand td{font-weight:800;background:var(--navy);color:var(--gold)}tr.grand td:first-child{background:var(--navy)}
tr.dlt td{font-size:11.5px;color:var(--muted)}
.mlist summary{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;font-weight:700}
.mlist ul.entries{padding-left:14px}
.row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.btn{padding:10px 14px;border-radius:10px;background:var(--field);font-weight:600;border:1px solid var(--line)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.ico{width:36px;height:36px;padding:0;display:grid;place-items:center}
.btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.catgrid{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;border-left:5px solid var(--cc,var(--gold));border-radius:14px 14px 0 0}
.catgrid small{font-weight:400;color:var(--muted)}
.fxrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--on-gold);font-size:32px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav .wrap{display:flex;padding:0}
nav button{flex:1;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:11px;font-weight:600;min-height:58px;justify-content:center;border-top:3px solid transparent}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--text);border-top-color:var(--gold)}
#ov{position:fixed;inset:0;background:rgba(3,10,22,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.show{display:flex}
#sheet{background:var(--card);width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;overflow:auto;border-top:4px solid var(--gold)}
#sheet h3{margin:0 0 10px;font-size:19px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
select,input[type=text],input[type=date],input[type=search],input[type=number]{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--text)}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
.qd{display:flex;gap:6px;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:16px}.actions .btn{flex:1;text-align:center}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin-top:6px;max-height:150px;overflow:auto}
.ib{height:40px;border-radius:8px;font-size:21px;background:var(--field)}.ib.on{outline:2px solid var(--gold)}
.pend{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pend input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);flex:none}
.pend input[type=text]{width:110px;flex:none;padding:8px}
.srow{display:flex;gap:8px}.srow input{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;display:flex;gap:12px;align-items:center;max-width:92vw}
#toast.show{opacity:1}#toast.act{pointer-events:auto}
#toast button{color:var(--gold);font-weight:700}
.warn{background:#fff3cd;color:#664d03;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:14px}
@media(min-width:560px){.donutwrap{flex-direction:row;align-items:center}.legend{flex:1}}
</style>
</head>
<body>

<script>
(function(){
'use strict';
const KEY='despesas_v1';
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DIAS3=['dom','seg','ter','qua','qui','sex','sáb'];
const PALETTE=['#d4af37','#4f7bc8','#2a9d8f','#e76f51','#8e6bbf','#6ba368','#c9506b','#7a869a','#b5651d','#3fa7d6','#8a9a2b','#b04bb0'];
const DEFAULTS=[
['Habitação','🏠',[['Renda / prestação da casa','🔑'],['Condomínio','🏢'],['Seguro da habitação','🛡️'],['Obras e reparações','🔧'],['Produtos de limpeza','🧽'],['Mobiliário e eletrodomésticos','🛋️']]],
['Utilidades','💡',[['Eletricidade','⚡'],['Gás','🔥'],['Água','🚰'],['Saneamento','🚿'],['Resíduos','🗑️'],['Internet','🌐'],['TV','📺'],['Telefone fixo','☎️'],['Telemóvel','📱']]],
['Impostos e taxas','🧾',[['IMI','🏛️'],['IUC','🚗'],['IRS','📑'],['Imposto de selo','🔖'],['Outros impostos e taxas','💶']]],
['Transportes','🚗',[['Gasóleo','⛽'],['Portagens','🛣️'],['Seguro automóvel','🛡️'],['Manutenção e revisões','🔧'],['Inspeção (IPO)','✅'],['Pneus','🛞'],['Estacionamento','🅿️'],['Transportes públicos','🚆']]],
['Alimentação','🛒',[['Compras semanais','🛒'],['Talho','🥩'],['Peixaria','🐟'],['Fruta e legumes','🥦'],['Pão e pastelaria','🥖'],['Restaurantes','🍽️'],['Take-away','🥡'],['Cafés','☕']]],
['Animais','🐾',[['Comida para cão','🐕'],['Comida para gato','🐈'],['Veterinário','🩺'],['Vacinas e desparasitantes','💉'],['Higiene e acessórios','🧴']]],
['Saúde','💊',[['Farmácia','💊'],['Consultas','🩺'],['Exames','🔬'],['Dentista','🦷'],['Ótica','👓'],['Seguro de saúde','🛡️']]],
['Lazer e outros','🎉',[['Streaming','🎬'],['Ginásio / desporto','🏋️'],['Roupa','👕'],['Calçado','👟'],['Educação','🎓'],['Prendas','🎁'],['Viagens e férias','✈️'],['Imprevistos','❗']]]
];
const ICONS=['🏠','🔑','🏢','🛋️','🧽','🔧','🛠️','💡','⚡','🔥','🚰','🚿','🗑️','🌐','📺','📱','☎️','🧾','🏛️','🚗','⛽','🛣️','🛞','🅿️','🚆','🚌','🚲','✈️','🛒','🥩','🐟','🥦','🥖','🍽️','🥡','☕','🍺','🐾','🐕','🐈','🩺','💉','💊','🦷','👓','🏋️','🎬','🎵','🎮','📚','🎓','👕','👟','🎁','🎉','🧴','💰','💶','🏦','📑','🛡️','🧒','🍼','💇','🌳','❗','📦','⭐','📁'];

let state=null,storageOK=true,IDX={byMonth:{}},READS={},ctx=null,lastTab=null,lastDeleted=null;
const view={tab:'mes',y:0,m:0,amode:'mes',focus:'all',cview:'tabela',collapsed:new Set(),
  sd:{q:'',period:'all',from:'',to:'',cat:'',sub:'',min:'',max:'',sort:'date_desc'},sa:null};
const openCats=new Set(),openSubs=new Set();

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>iso(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'});
const num=new Intl.NumberFormat('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=c=>eur.format(c/100);
const n2=c=>num.format(c/100);
const fmtDate=s=>s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const mkey=(y,m)=>y+'-'+pad(m+1);
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const prevYM=(y,m)=>m===0?{y:y-1,m:11}:{y:y,m:m-1};
const nextYM=(y,m)=>m===11?{y:y+1,m:0}:{y:y,m:m+1};
const sumList=l=>{let t=0;for(const e of l)t+=e.cents;return t;};
const bySub=l=>{const m={};for(const e of l)m[e.sub]=(m[e.sub]||0)+e.cents;return m;};
const catSum=(c,bs)=>{let t=0;for(const s of c.subs)t+=bs[s.id]||0;return t;};
const newest=(a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0);
function fk(v){return v>=1000?(v/1000).toFixed(v%1000===0?0:1).replace('.',',')+'k':String(Math.round(v));}
function parseMoney(s){s=String(s||'').trim().replace(/\s/g,'').replace('€','');if(!s)return null;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');if(!/^\d*\.?\d+$/.test(s))return NaN;return Math.round(parseFloat(s)*100);}
function toast(msg,undo){const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">Desfazer</button>':'');t.classList.add('show');t.classList.toggle('act',!!undo);clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show','act'),undo?6000:1800);}

/* ---------- dados ---------- */
function seed(){
  return migrate({v:2,lastSub:null,lastBackup:null,
    cats:DEFAULTS.map(c=>({id:uid(),name:c[0],icon:c[1],subs:c[2].map(s=>({id:uid(),name:s[0],icon:s[1]}))})),
    entries:[],fixed:[]});
}
function migrate(s){
  s.v=2;s.prefs=Object.assign({compare:false,onlySpent:false},s.prefs||{});s.fixed=s.fixed||[];
  const ci={},si={};DEFAULTS.forEach(d=>{ci[d[0]]=d[1];d[2].forEach(x=>si[x[0]]=x[1]);});
  s.cats.forEach((c,i)=>{
    if(!c.icon)c.icon=ci[c.name]||'📁';
    if(!c.color)c.color=PALETTE[i%PALETTE.length];
    if(typeof c.budget!=='number')c.budget=0;
    c.subs.forEach(x=>{if(x.icon===undefined)x.icon=si[x.name]||'';});
  });
  const ids=new Set();s.cats.forEach(c=>c.subs.forEach(x=>ids.add(x.id)));
  const orph=s.entries.filter(e=>!ids.has(e.sub));
  if(orph.length){const sub={id:uid(),name:'Sem rubrica',icon:''};s.cats.push({id:uid(),name:'Recuperados',icon:'📁',color:PALETTE[s.cats.length%PALETTE.length],budget:0,subs:[sub]});orph.forEach(e=>e.sub=sub.id);}
  s.entries.forEach(e=>{if(typeof e.item!=='string')e.item='';});
  s.fixed=s.fixed.filter(f=>ids.has(f.sub)||s.cats.some(c=>c.subs.some(x=>x.id===f.sub)));
  return s;
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){storageOK=false;}
  if(raw){
    try{const s=JSON.parse(raw);if(s&&Array.isArray(s.cats)&&Array.isArray(s.entries)){state=migrate(s);save();return;}}
    catch(e){try{localStorage.setItem(KEY+'_corrompido_'+Date.now(),raw);}catch(x){}}
  }
  state=seed();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
function findSub(id){for(const c of state.cats)for(const s of c.subs)if(s.id===id)return {cat:c,sub:s};return null;}
const getCat=id=>state.cats.find(c=>c.id===id);
const subIcon=(s,c)=>s.icon||c.icon;
function reindex(){IDX={byMonth:{}};for(const e of state.entries){const k=e.date.slice(0,7);(IDX.byMonth[k]||(IDX.byMonth[k]=[])).push(e);}}
const mEntries=(y,m)=>IDX.byMonth[mkey(y,m)]||[];
function monthsWindow(y,m,n){const a=[];let c={y,m};for(let i=0;i<n;i++){a.unshift(c);c=prevYM(c.y,c.m);}return a;}
function shiftWin(win,k){return win.map(w=>{let c=w;for(let i=0;i<Math.abs(k);i++)c=k<0?prevYM(c.y,c.m):nextYM(c.y,c.m);return c;});}

/* ---------- componentes ---------- */
function dlt(cur,prev){
  if(!cur&&!prev)return '';
  if(!prev)return '<span class="dl up">novo</span>';
  if(cur===prev)return '<span class="dl eq">= igual</span>';
  const p=Math.abs((cur-prev)/prev*100),up=cur>prev;
  return '<span class="dl '+(up?'up':'dn')+'">'+(up?'▲':'▼')+' '+(p>=10?p.toFixed(0):p.toFixed(1).replace('.',','))+'%</span>';
}
function dAbs(cur,prev){const d=cur-prev;return (d>0?'+':d<0?'−':'')+fmt(Math.abs(d));}
function bar(v,max){const p=max>0?v/max*100:0;return '<span class="bud'+(p>100?' over':p>=80?' warn':'')+'"><i style="width:'+Math.min(100,p)+'%"></i></span>';}
const kpi=(l,v,s)=>'<div class="kpi"><div class="kl">'+l+'</div><div class="kv">'+v+'</div>'+(s?'<div class="ks">'+s+'</div>':'')+'</div>';
const emptyBox=t=>'<div class="card emptybox">'+t+'</div>';
function monthNav(){return '<div class="mnav"><button class="arrow" data-act="prev" aria-label="Mês anterior">‹</button><button class="mlabel" data-act="today" aria-label="Ir para o mês atual">'+MESES[view.m]+' '+view.y+'</button><button class="arrow" data-act="next" aria-label="Mês seguinte">›</button></div>';}
function yearNav(){return '<div class="mnav"><button class="arrow" data-act="yprev" aria-label="Ano anterior">‹</button><button class="mlabel" data-act="today" aria-label="Ir para o ano atual">'+view.y+'</button><button class="arrow" data-act="ynext" aria-label="Ano seguinte">›</button></div>';}
function catOptions(sel,all){return (all?'<option value="">'+all+'</option>':'')+state.cats.map(c=>'<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.icon+' '+c.name)+'</option>').join('');}
function subOptions(catId,sel,all){const c=getCat(catId);return (all?'<option value="">'+all+'</option>':'')+(c?c.subs.map(s=>'<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+esc(subIcon(s,c)+' '+s.name)+'</option>').join(''):'');}
function allSubOptions(exclude,sel){return state.cats.map(c=>{const o=c.subs.filter(s=>s.id!==exclude).map(s=>'<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+esc(subIcon(s,c)+' '+s.name)+'</option>').join('');return o?'<optgroup label="'+esc(c.icon+' '+c.name)+'">'+o+'</optgroup>':'';}).join('');}

function hbars(rows,max){return '<div class="hb">'+rows.map(r=>'<div class="hbr"><div class="hbl"><span class="ic sm" style="--cc:'+r.color+'">'+esc(r.icon)+'</span><span class="nm">'+esc(r.name)+'</span><span class="amt">'+fmt(r.value)+'</span></div><div class="trk"><i style="width:'+(max?Math.max(r.value/max*100,1.5):0)+'%;background:'+r.color+'"></i></div></div>').join('')+'</div>';}
function cmpbars(rows,curL,prevL){
  const max=Math.max(1,...rows.map(r=>Math.max(r.cur,r.prev)));
  return '<div class="hb">'+rows.map(r=>'<div class="hbr"><div class="hbl"><span class="ic sm" style="--cc:'+r.color+'">'+esc(r.icon)+'</span><span class="nm">'+esc(r.name)+'</span>'+dlt(r.cur,r.prev)+'</div>'+
    '<div class="hbl" style="margin:0"><span class="nm pv">'+curL+'</span><span class="amt">'+fmt(r.cur)+'</span></div><div class="trk"><i style="width:'+(r.cur/max*100)+'%;background:var(--gold)"></i></div>'+
    '<div class="hbl" style="margin:2px 0 0"><span class="nm pv">'+prevL+'</span><span class="amt pv">'+fmt(r.prev)+'</span></div><div class="trk prev"><i style="width:'+(r.prev/max*100)+'%"></i></div></div>').join('')+'</div>';
}
function donutBlock(rows,total,top,bot){
  const r=54,C=2*Math.PI*r;let acc=0,segs='';
  rows.forEach(x=>{const len=x.value/total*C;segs+='<circle cx="90" cy="90" r="'+r+'" fill="none" stroke="'+x.color+'" stroke-width="28" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 90 90)"/>';acc+=len;});
  const svg='<svg viewBox="0 0 180 180" class="donut chart" role="img" aria-label="Distribuição por categoria">'+segs+'<text x="90" y="88" text-anchor="middle" class="dc1">'+top+'</text><text x="90" y="104" text-anchor="middle" class="dc2">'+bot+'</text></svg>';
  const leg=rows.map(x=>'<div class="lg"><span class="dot" style="background:'+x.color+'"></span><span class="nm">'+esc(x.icon+' '+x.name)+'</span><span class="amt">'+fmt(x.value)+'</span><span class="pc">'+(x.value/total*100).toFixed(0)+'%</span></div>').join('');
  return '<div class="donutwrap">'+svg+'<div class="legend">'+leg+'</div></div>';
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;const n=[1,1.2,1.6,2,2.4,3,4,5,6,8,10].find(x=>f<=x+1e-9);return n*p;}
function colChart(id,labels,series,reads,selIdx){
  READS[id]=reads;
  const n=labels.length,W=340,H=190,L=34,R=6,T=14,B=24,pw=W-L-R,ph=H-T-B;
  const tot=labels.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0)/100);
  const mx=niceMax(Math.max(...tot,1)),step=pw/n,bw=Math.min(step*.64,26);
  const act=tot.filter(v=>v>0),avg=act.length?act.reduce((a,b)=>a+b,0)/act.length:0;
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Gráfico de colunas por mês">';
  for(let g=0;g<=4;g++){const v=mx*g/4,y=T+ph-ph*g/4;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+fk(v)+'</text>';}
  labels.forEach((lb,i)=>{
    const x=L+step*i+(step-bw)/2;let y=T+ph;
    series.forEach(se=>{const v=se.vals[i]/100;if(v<=0)return;const hh=ph*v/mx;y-=hh;s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(hh,.8).toFixed(1)+'" fill="'+se.color+'"/>';});
    s+='<text class="ax" x="'+(L+step*i+step/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+lb+'</text>';
    s+='<rect class="hit'+(i===selIdx?' sel':'')+'" data-act="colpick" data-id="'+id+'" data-i="'+i+'" x="'+(L+step*i).toFixed(1)+'" y="'+T+'" width="'+step.toFixed(1)+'" height="'+(ph+B)+'"/>';
  });
  if(avg>0){const y=T+ph-ph*avg/mx;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#e76f51" stroke-width="1.2" stroke-dasharray="4 3"/>';}
  s+='</svg>';
  return s+'<div class="readout" id="rd-'+id+'">'+(reads[selIdx]||'')+'</div>'+(avg>0?'<div class="legchips"><span><i style="display:inline-block;width:16px;border-top:2px dashed #e76f51;vertical-align:middle;margin-right:4px"></i>Média mensal (meses com gastos): '+fmt(Math.round(avg*100))+'</span></div>':'');
}
function lineChart(N,cur,prev){
  const W=340,H=170,L=34,R=8,T=10,B=22,pw=W-L-R,ph=H-T-B;
  const mx=niceMax(Math.max(1,...cur,...prev)/100),X=d=>L+pw*d/Math.max(N-1,1),Y=v=>T+ph-ph*(v/100)/mx;
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Gasto acumulado ao longo do mês">';
  for(let g=0;g<=4;g++){const v=mx*g/4,y=T+ph-ph*g/4;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+fk(v)+'</text>';}
  [1,5,10,15,20,25,N].forEach(d=>{if(d<=N)s+='<text class="ax" x="'+X(d-1).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+d+'</text>';});
  const pl=(a)=>a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  if(prev.length)s+='<polyline fill="none" stroke="#7a869a" stroke-width="2" stroke-dasharray="5 4" points="'+pl(prev)+'"/>';
  if(cur.length){s+='<polyline fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round" points="'+pl(cur)+'"/><circle cx="'+X(cur.length-1).toFixed(1)+'" cy="'+Y(cur[cur.length-1]).toFixed(1)+'" r="4" fill="var(--gold)"/>';}
  return s+'</svg>';
}

/* ---------- vista: mês ---------- */
function entryLi(e,showCat){
  const f=findSub(e.sub);
  return '<li><div class="en"><div class="it">'+(e.item?esc(e.item):'<em>sem descrição</em>')+'</div><div class="dt">'+fmtDate(e.date)+(e.fx?' · fixa':'')+(showCat&&f?' · '+esc(f.cat.name+' › '+f.sub.name):'')+'</div></div><div class="ea">'+fmt(e.cents)+'</div><button data-act="edit" data-id="'+e.id+'" aria-label="Editar">✎</button><button data-act="del" data-id="'+e.id+'" aria-label="Apagar">✕</button></li>';
}
function pendingFixed(y,m){
  const now=new Date();if(y>now.getFullYear()||(y===now.getFullYear()&&m>now.getMonth()))return [];
  const cur=mEntries(y,m);return state.fixed.filter(f=>findSub(f.sub)&&!cur.some(e=>e.fx===f.id));
}
function backupDue(){
  if(state.entries.length<10)return false;
  if(!state.lastBackup)return true;
  return (Date.now()-new Date(state.lastBackup+'T12:00:00').getTime())>30*86400000;
}
function viewMes(){
  const y=view.y,m=view.m,pm=prevYM(y,m),cur=mEntries(y,m),prev=mEntries(pm.y,pm.m);
  const tc=sumList(cur),tp=sumList(prev),bs=bySub(cur),bp=bySub(prev),cmp=state.prefs.compare,only=state.prefs.onlySpent;
  let h=monthNav(),right='';
  if(tp>0)right='<div>vs '+MES3[pm.m]+'</div><div class="vsv">'+dlt(tc,tp)+'</div><div>'+dAbs(tc,tp)+'</div>';
  else if(tc>0)right='<div>Sem dados em '+MES3[pm.m]+'</div>';
  let bt=0,bsp=0;state.cats.forEach(c=>{if(c.budget>0){bt+=c.budget;bsp+=catSum(c,bs);}});
  h+='<div class="card total"><div class="trow"><div><div class="lbl">Total de '+MESES[m].toLowerCase()+'</div><div class="big">'+fmt(tc)+'</div><div class="lbl">'+cur.length+' registo'+(cur.length===1?'':'s')+'</div></div><div class="tright">'+right+'</div></div>'+
    (bt>0?'<div class="tbud"><div class="lbl">Orçamento: '+fmt(bsp)+' de '+fmt(bt)+' ('+Math.round(bsp/bt*100)+'%)</div>'+bar(bsp,bt)+'</div>':'')+'</div>';
  h+='<div class="prefs"><label class="sw"><input type="checkbox" data-pref="compare"'+(cmp?' checked':'')+'><span>Comparar com '+MESES[pm.m].toLowerCase()+'</span></label><label class="sw"><input type="checkbox" data-pref="onlySpent"'+(only?' checked':'')+'><span>Só rubricas com gastos</span></label></div>';
  const pf=pendingFixed(y,m);
  if(pf.length)h+='<div class="card banner"><span class="nm">📌 '+pf.length+' despesa'+(pf.length>1?'s fixas':' fixa')+' por lançar em '+MESES[m].toLowerCase()+'</span><button class="btn sm primary" data-act="launchfx">Rever</button></div>';
  if(backupDue())h+='<div class="card banner"><span class="nm">💾 Já passou muito tempo desde a última cópia de segurança.</span><button class="btn sm" data-act="exportjson">Guardar</button></div>';
  state.cats.forEach(c=>{
    const ct=catSum(c,bs),cp=catSum(c,bp);
    const subs=c.subs.filter(s=>!only||bs[s.id]||(cmp&&bp[s.id]));
    if(only&&!subs.length)return;
    h+='<details class="card cat" data-cat="'+c.id+'" style="--cc:'+c.color+'"'+(openCats.has(c.id)?' open':'')+'><summary><span class="ic">'+esc(c.icon)+'</span><span class="nm">'+esc(c.name)+'</span><span class="amtw"><span class="amt'+(ct?'':' zero')+'">'+(ct?fmt(ct):'—')+'</span>'+(cmp&&(ct||cp)?'<small class="cmpl">ant. '+fmt(cp)+' '+dlt(ct,cp)+'</small>':'')+'</span>'+
      (c.budget>0?'<span class="budtxt">Orçamento: '+fmt(ct)+' de '+fmt(c.budget)+' ('+Math.round(ct/c.budget*100)+'%)</span>'+bar(ct,c.budget):'')+'</summary>';
    subs.forEach(s=>{
      const list=(IDX.byMonth[mkey(y,m)]||[]).filter(e=>e.sub===s.id).sort(newest),st=bs[s.id]||0,sp=bp[s.id]||0;
      h+='<details class="sub" data-sub="'+s.id+'"'+(openSubs.has(s.id)?' open':'')+'><summary><span class="ic sm" style="--cc:'+c.color+'">'+esc(subIcon(s,c))+'</span><span class="nm">'+esc(s.name)+'</span><span class="amtw"><span class="amt'+(st?'':' zero')+'">'+(st?fmt(st):'—')+'</span>'+(cmp&&(st||sp)?'<small class="cmpl">ant. '+fmt(sp)+' '+dlt(st,sp)+'</small>':'')+'</span><button class="plus" data-act="add" data-sub="'+s.id+'" aria-label="Adicionar em '+esc(s.name)+'">+</button></summary>'+
        (list.length?'<ul class="entries">'+list.map(e=>entryLi(e)).join('')+'</ul>':'<div class="empty">Sem registos neste mês.</div>')+'</details>';
    });
    h+='</details>';
  });
  return h;
}

/* ---------- vista: informação completa ---------- */
function viewCompleta(){
  const y=view.y,ys=y+'-',list=state.entries.filter(e=>e.date.startsWith(ys)),plist=state.entries.filter(e=>e.date.startsWith((y-1)+'-'));
  const M={};list.forEach(e=>{(M[e.sub]||(M[e.sub]=Array(12).fill(0)))[+e.date.slice(5,7)-1]+=e.cents;});
  const total=sumList(list),ptotal=sumList(plist),mt=Array(12).fill(0);list.forEach(e=>mt[+e.date.slice(5,7)-1]+=e.cents);
  const act=mt.filter(v=>v>0).length||1,hi=mt.indexOf(Math.max(...mt));
  let h='<h1>Informação completa</h1>'+yearNav();
  h+='<div class="seg"><button class="'+(view.cview==='tabela'?'on':'')+'" data-act="cview" data-v="tabela">Tabela por mês</button><button class="'+(view.cview==='registos'?'on':'')+'" data-act="cview" data-v="registos">Todos os registos</button></div>';
  if(!list.length)return h+emptyBox('Sem registos em '+y+'.');
  h+='<div class="kpis">'+kpi('Total do ano',fmt(total),ptotal>0?dlt(total,ptotal)+' vs '+(y-1):'')+kpi('Média mensal',fmt(Math.round(total/act)),'em '+act+(act>1?' meses':' mês')+' com gastos')+kpi('Mês mais caro',MESES[hi],fmt(mt[hi]))+kpi('Registos',list.length,'em '+y)+'</div>';
  if(view.cview==='registos'){
    const months=[...new Set(list.map(e=>e.date.slice(0,7)))].sort().reverse();
    h+=months.map((k,i)=>{const l=list.filter(e=>e.date.startsWith(k)).sort(newest);return '<details class="card mlist" data-ml="'+k+'"'+(i===0||openSubs.has('ml'+k)?' open':'')+'><summary><span>'+MESES[+k.slice(5)-1]+' · '+l.length+' reg.</span><span class="amt">'+fmt(sumList(l))+'</span></summary><ul class="entries">'+l.map(e=>{const f=findSub(e.sub);return entryLi(e,true).replace('<div class="it">','<div class="it">'+(f?esc(subIcon(f.sub,f.cat))+' ':''));}).join('')+'</ul></details>';}).join('');
    return h+'<div class="btns"><button class="btn" data-act="exportcsv" data-y="'+y+'">Exportar CSV de '+y+'</button></div>';
  }
  const cells=(a,heat)=>{const mx=Math.max(...a,1);return a.map(v=>'<td'+(v&&heat?' style="background:rgba(212,175,55,'+(.1+.5*v/mx).toFixed(2)+')"':'')+'>'+(v?n2(v):'–')+'</td>').join('');};
  let body='';
  state.cats.forEach(c=>{
    const rows=[],cm=Array(12).fill(0);
    c.subs.forEach(s=>{const a=M[s.id];if(!a)return;rows.push({s,a});a.forEach((v,i)=>cm[i]+=v);});
    if(!rows.length)return;
    const ct=cm.reduce((a,b)=>a+b,0),col=view.collapsed.has(c.id);
    body+='<tr class="catrow" data-act="togglecat" data-cat="'+c.id+'" style="--cc:'+c.color+'"><td>'+(col?'▸':'▾')+' '+esc(c.icon+' '+c.name)+'</td>'+cells(cm,false)+'<td><b>'+n2(ct)+'</b></td><td>'+n2(ct/act)+'</td><td>'+(ct/total*100).toFixed(1).replace('.',',')+'%</td></tr>';
    if(!col)rows.forEach(r=>{const t=r.a.reduce((a,b)=>a+b,0);body+='<tr class="subrow"><td>'+esc(subIcon(r.s,c)+' '+r.s.name)+'</td>'+cells(r.a,true)+'<td><b>'+n2(t)+'</b></td><td>'+n2(t/act)+'</td><td>'+(t/total*100).toFixed(1).replace('.',',')+'%</td></tr>';});
  });
  body+='<tr class="grand"><td>TOTAL</td>'+mt.map(v=>'<td>'+(v?n2(v):'–')+'</td>').join('')+'<td>'+n2(total)+'</td><td>'+n2(total/act)+'</td><td>100%</td></tr>';
  body+='<tr class="dlt"><td>Variação vs mês anterior</td>'+mt.map((v,i)=>'<td>'+(i>0&&mt[i-1]>0&&v>0?dlt(v,mt[i-1]):'–')+'</td>').join('')+'<td></td><td></td><td></td></tr>';
  h+='<div class="tablewrap"><table><thead><tr><th>Valores em €</th>'+MES3.map(n=>'<th>'+n+'</th>').join('')+'<th>Total</th><th>Média</th><th>%</th></tr></thead><tbody>'+body+'</tbody></table></div>';
  h+='<p class="muted">Toque numa categoria para recolher ou expandir as rubricas. A cor dourada nas células mostra os meses mais fortes de cada rubrica. Média = total ÷ meses com gastos.</p>';
  return h+'<div class="btns"><button class="btn" data-act="exportcsv" data-y="'+y+'">Exportar CSV de '+y+'</button></div>';
}

/* ---------- vista: análises ---------- */
function insightsTop(bs,bp,tc,tp,labelPrev){
  const out=[];
  const cats=state.cats.map(c=>({c,v:catSum(c,bs),p:catSum(c,bp)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  if(cats.length)out.push(cats[0].c.icon+' <b>'+esc(cats[0].c.name)+'</b> é a categoria com mais gastos: '+fmt(cats[0].v)+' ('+Math.round(cats[0].v/tc*100)+'% do total).');
  const subs=[];state.cats.forEach(c=>c.subs.forEach(s=>subs.push({c,s,v:bs[s.id]||0,p:bp[s.id]||0})));
  const ts=subs.slice().sort((a,b)=>b.v-a.v)[0];
  if(ts&&ts.v>0)out.push('🏆 Rubrica mais cara: <b>'+esc(ts.s.name)+'</b> com '+fmt(ts.v)+'.');

/* ---------- vista: pesquisa ---------- */
function periodRange(p){
  const now=new Date(),t=iso(now),Y=now.getFullYear(),M=now.getMonth(),pm=prevYM(Y,M);
  switch(p.period){
    case 'today':return [t,t];
    case '7d':return [iso(new Date(now.getTime()-6*86400000)),t];
    case 'month':return [mkey(Y,M)+'-01',mkey(Y,M)+'-31'];
    case 'lastmonth':return [mkey(pm.y,pm.m)+'-01',mkey(pm.y,pm.m)+'-31'];
    case 'year':return [Y+'-01-01',Y+'-12-31'];
    case 'custom':return [p.from||'0000-00-00',p.to||'9999-99-99'];
    default:return ['0000-00-00','9999-99-99'];
  }
}
function runQuery(p){
  const words=norm(p.q).split(/\s+/).filter(Boolean),r=periodRange(p),mn=parseMoney(p.min),mx=parseMoney(p.max);
  const res=state.entries.filter(e=>{
    if(e.date<r[0]||e.date>r[1])return false;
    const f=findSub(e.sub);if(!f)return false;
    if(p.cat&&f.cat.id!==p.cat)return false;if(p.sub&&f.sub.id!==p.sub)return false;
    if(mn!==null&&!isNaN(mn)&&e.cents<mn)return false;if(mx!==null&&!isNaN(mx)&&e.cents>mx)return false;
    if(words.length){const hay=norm(e.item+' '+f.sub.name+' '+f.cat.name);if(!words.every(w=>hay.includes(w)))return false;}
    return true;
  });
  const s=p.sort;
  res.sort(s==='date_asc'?(a,b)=>-newest(a,b):s==='val_desc'?(a,b)=>b.cents-a.cents:s==='val_asc'?(a,b)=>a.cents-b.cents:newest);
  return res;
}
function searchResults(){

function shortcutChips(){
  const cnt={},last={};
  state.entries.slice().sort(newest).slice(0,400).forEach(e=>{const k=e.sub+'|'+e.item;cnt[k]=(cnt[k]||0)+1;if(!last[k])last[k]=e;});
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,6).filter(k=>findSub(last[k].sub));
  if(!top.length)return '';
  return '<div class="muted" style="margin-top:4px">Atalhos frequentes</div><div class="chips">'+top.map(k=>{const e=last[k],f=findSub(e.sub);return '<button type="button" class="chip" data-act="chip" data-sub="'+e.sub+'" data-item="'+esc(e.item)+'" data-amt="'+(e.cents/100).toFixed(2).replace('.',',')+'">'+esc(subIcon(f.sub,f.cat)+' '+f.sub.name+(e.item?' · '+e.item:''))+'</button>';}).join('')+'</div>';
}
function fillSuggestions(){
  const sub=$('#fsub')&&$('#fsub').value,c={};
  state.entries.forEach(e=>{if(e.sub===sub&&e.item)c[e.item]=(c[e.item]||0)+1;});
  const dl=$('#fitems');if(dl)dl.innerHTML=Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,40).map(i=>'<option value="'+esc(i)+'">').join('');
}
function openForm(id,subId){
  if(!state.cats.some(c=>c.subs.length)){toast('Crie primeiro uma rubrica em Gerir');return;}
  const e=id?state.entries.find(x=>x.id===id):null;
  let f=findSub(e?e.sub:(subId||state.lastSub));
  if(!f){const c0=state.cats.find(c=>c.subs.length);f={cat:c0,sub:c0.subs[0]};}
  ctx={type:'entry',id:id||null};
  openSheet('<h3>'+(e?'Editar despesa':'Nova despesa')+'</h3>'+(e?'':shortcutChips())+
    '<div class="two"><div><label class="f" for="fdate">Data</label><input type="date" id="fdate" value="'+(e?e.date:todayStr())+'"></div><div><label class="f" for="famt">Valor (€)</label><input type="text" id="famt" inputmode="decimal" placeholder="0,00" autocomplete="off" value="'+(e?(e.cents/100).toFixed(2).replace('.',','):'')+'"></div></div>'+
    '<div class="qd"><button type="button" class="btn sm" data-act="dtoday">Hoje</button><button type="button" class="btn sm" data-act="dyest">Ontem</button></div>'+
    '<label class="f" for="fcat">Categoria</label><select id="fcat" data-chg="catsel" data-p="f">'+catOptions(f.cat.id)+'</select>'+
    '<label class="f" for="fsub">Rubrica</label><select id="fsub" data-chg="fsub">'+subOptions(f.cat.id,f.sub.id)+'</select>'+
    '<label class="f" for="fitem">Descrição (opcional), por exemplo o nome do medicamento</label><input type="text" id="fitem" list="fitems" autocomplete="off" placeholder="ex.: Ben-u-ron 1000" value="'+esc(e?e.item:'')+'"><datalist id="fitems"></datalist>'+
    '<div class="actions"><button class="btn" data-act="closesheet">Cancelar</button>'+(e?'':'<button class="btn" data-act="fsaveagain">Guardar e novo</button>')+'<button class="btn primary" data-act="fsave">Guardar</button></div>');
  fillSuggestions();
  setTimeout(()=>{const x=e?$('#fitem'):$('#famt');if(x)x.focus();},60);
}
function saveForm(again){
  const cents=parseMoney($('#famt').value);
  if(cents===null||isNaN(cents)||cents<=0){toast('Valor inválido');$('#famt').focus();return;}
  const date=$('#fdate').value,sub=$('#fsub').value,item=$('#fitem').value.trim();
  if(!date){toast('Indique a data');return;}
  const f=findSub(sub);if(!f){toast('Escolha a rubrica');return;}
  const editing=ctx&&ctx.id;
  if(editing){const e=state.entries.find(x=>x.id===ctx.id);if(e){e.date=date;e.sub=sub;e.item=item;e.cents=cents;}}
  else state.entries.push({id:uid(),date:date,sub:sub,item:item,cents:cents,ts:Date.now()});
  state.lastSub=sub;save();
  if(view.tab==='mes'){view.y=+date.slice(0,4);view.m=+date.slice(5,7)-1;openCats.add(f.cat.id);openSubs.add(sub);}
  render();
  if(again&&!editing){$('#famt').value='';$('#fitem').value='';$('#famt').focus();toast('Guardado em '+f.sub.name);}
  else{closeSheet();toast('Guardado');}
}
function iconPicker(sel,optional){
  return '<label class="f" for="eic">Ícone</label><input type="text" id="eic" maxlength="8" value="'+esc(sel||'')+'" placeholder="'+(optional?'(usa o da categoria)':'escolha ou escreva um emoji')+'"><div class="icons">'+(optional?'<button type="button" class="ib" data-act="pickicon" data-ic="" title="Usar o da categoria" style="font-size:12px">auto</button>':'')+ICONS.map(i=>'<button type="button" class="ib'+(i===sel?' on':'')+'" data-act="pickicon" data-ic="'+i+'">'+i+'</button>').join('')+'</div>';
}
function openCatSheet(id){
  const c=id?getCat(id):null;ctx={type:'cat',id:id||null};
  openSheet('<h3>'+(c?'Editar categoria':'Nova categoria')+'</h3><label class="f" for="enm">Nome</label><input type="text" id="enm" value="'+esc(c?c.name:'')+'" autocomplete="off">'+
    '<label class="f" for="ebud">Orçamento mensal (€), opcional</label><input type="text" id="ebud" inputmode="decimal" placeholder="sem orçamento" value="'+(c&&c.budget>0?(c.budget/100).toFixed(2).replace('.',','):'')+'">'+iconPicker(c?c.icon:'📁',false)+
    '<div class="actions"><button class="btn" data-act="closesheet">Cancelar</button><button class="btn primary" data-act="savecat">Guardar</button></div>');
}
function openSubSheet(id,catId){
  const f=id?findSub(id):null;ctx={type:'sub',id:id||null};const cid=f?f.cat.id:catId;
  openSheet('<h3>'+(f?'Editar rubrica':'Nova rubrica')+'</h3><label class="f" for="enm">Nome</label><input type="text" id="enm" value="'+esc(f?f.sub.name:'')+'" autocomplete="off">'+
    '<label class="f" for="ecat">Categoria</label><select id="ecat">'+catOptions(cid)+'</select>'+iconPicker(f?f.sub.icon:'',true)+
    '<div class="actions"><button class="btn" data-act="closesheet">Cancelar</button><button class="btn primary" data-act="savesub">Guardar</button></div>');
}
function openDelSheet(kind,id){
  let name,subs,cnt;
  if(kind==='cat'){const c=getCat(id);name=c.name;subs=c.subs.map(s=>s.id);}else{const f=findSub(id);name=f.sub.name;subs=[id];}
  cnt=state.entries.filter(e=>subs.indexOf(e.sub)>=0).length;ctx={type:'del',kind:kind,id:id,subs:subs};
  const other=kind==='cat'?state.cats.some(c=>c.id!==id&&c.subs.length):state.cats.some(c=>c.subs.some(s=>s.id!==id));
  openSheet('<h3>Apagar '+(kind==='cat'?'categoria':'rubrica')+' «'+esc(name)+'»</h3><p>'+(cnt?'Tem <b>'+cnt+' registo'+(cnt>1?'s':'')+'</b>. Pode mover'+(cnt>1?'-os':'-o')+' para outra rubrica antes de apagar.':'Não tem registos.')+(kind==='cat'?' As rubricas desta categoria também serão apagadas.':'')+'</p>'+
    (cnt&&other?'<label class="f" for="dmove">Mover registos para</label><select id="dmove"><option value="">— escolher rubrica —</option>'+allSubOptions(kind==='sub'?id:'',''+'').replace(new RegExp('<option value="('+subs.join('|')+')"[^>]*>[^<]*</option>','g'),'')+'</select>':'')+
    '<div class="actions"><button class="btn" data-act="closesheet">Cancelar</button>'+(cnt&&other?'<button class="btn primary" data-act="delmove">Mover e apagar</button>':'')+'<button class="btn danger" data-act="delall">'+(cnt?'Apagar tudo':'Apagar')+'</button></div>');
}
function openFxSheet(id){
  const f=id?state.fixed.find(x=>x.id===id):null;ctx={type:'fx',id:id||null};
  const x=f?findSub(f.sub):null,c0=x?x.cat:state.cats.find(c=>c.subs.length);
  if(!c0){toast('Crie primeiro uma rubrica');return;}
  openSheet('<h3>'+(f?'Editar despesa fixa':'Nova despesa fixa')+'</h3><label class="f" for="xcat">Categoria</label><select id="xcat" data-chg="catsel" data-p="x">'+catOptions(c0.id)+'</select><label class="f" for="xsub">Rubrica</label><select id="xsub">'+subOptions(c0.id,x?x.sub.id:'')+'</select>'+
    '<label class="f" for="xitem">Descrição (opcional)</label><input type="text" id="xitem" value="'+esc(f?f.item:'')+'" autocomplete="off"><div class="two"><div><label class="f" for="xamt">Valor habitual (€)</label><input type="text" id="xamt" inputmode="decimal" value="'+(f?(f.cents/100).toFixed(2).replace('.',','):'')+'"></div><div><label class="f" for="xday">Dia do mês</label><input type="number" id="xday" min="1" max="31" value="'+(f?f.day:1)+'"></div></div>'+
    '<div class="actions"><button class="btn" data-act="closesheet">Cancelar</button><button class="btn primary" data-act="savefx">Guardar</button></div>');
}
function openLaunch(){
  const pf=pendingFixed(view.y,view.m);if(!pf.length){toast('Nada por lançar');return;}
  ctx={type:'launch'};
  openSheet('<h3>Despesas fixas de '+MESES[view.m].toLowerCase()+'</h3><p class="muted">Confirme ou ajuste os valores e desmarque o que não se aplica.</p>'+pf.map(f=>{const x=findSub(f.sub);return '<div class="pend"><input type="checkbox" data-fxc="'+f.id+'" checked aria-label="Lançar"><span class="nm">'+esc(subIcon(x.sub,x.cat)+' '+x.sub.name+(f.item?' · '+f.item:''))+'<br><small class="muted">dia '+f.day+'</small></span><input type="text" inputmode="decimal" data-fxa="'+f.id+'" value="'+(f.cents/100).toFixed(2).replace('.',',')+'" aria-label="Valor"></div>';}).join('')+
    '<div class="actions"><button class="btn" data-act="closesheet">Cancelar</button><button class="btn primary" data-act="dolaunch">Lançar selecionadas</button></div>');
}

/* ---------- ficheiros ---------- */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
function exportJSON(){state.lastBackup=todayStr();save();download('despesas-backup-'+todayStr()+'.json',new Blob([JSON.stringify(state)],{type:'application/json'}));render();toast('Cópia guardada');}
function exportCSV(year){
  const rows=[['Data','Categoria','Rubrica','Descrição','Valor (€)']];
  state.entries.filter(e=>!year||e.date.startsWith(year+'-')).sort((a,b)=>-newest(a,b)).forEach(e=>{const f=findSub(e.sub);rows.push([e.date,f?f.cat.name:'?',f?f.sub.name:'?',e.item,(e.cents/100).toFixed(2).replace('.',',')]);});
  download('despesas-'+(year||'tudo')+'.csv',new Blob(['﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const s=JSON.parse(r.result);if(!s||!Array.isArray(s.cats)||!Array.isArray(s.entries))throw 0;
    s.entries.forEach(e=>{if(typeof e.cents!=='number'||!e.date||!e.sub)throw 0;});
    if(!confirm('Substituir todos os dados atuais pelos desta cópia ('+s.entries.length+' registos)?'))return;
    state=migrate(s);save();render();toast('Cópia restaurada');
  }catch(x){toast('Ficheiro inválido');}};
  r.readAsText(file);
}

/* ---------- ações ---------- */
function moveItem(k,id,d){
  let arr;if(k==='c')arr=state.cats;else{const f=findSub(id);arr=f.cat.subs;}
  const i=arr.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=arr.length)return;
  const t=arr[i];arr[i]=arr[j];arr[j]=t;save();render();
}
function nextColor(){const used=new Set(state.cats.map(c=>c.color));return PALETTE.find(c=>!used.has(c))||PALETTE[state.cats.length%PALETTE.length];}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,d=t.dataset;
  if(a==='add'){ev.preventDefault();ev.stopPropagation();openForm(null,d.sub);return;}
  ev.preventDefault();
  switch(a){
    case 'tab':view.tab=d.tab;render();break;
    case 'prev':{const p=prevYM(view.y,view.m);view.y=p.y;view.m=p.m;render();break;}
    case 'next':{const p=nextYM(view.y,view.m);view.y=p.y;view.m=p.m;render();break;}
    case 'yprev':view.y--;render();break;
    case 'ynext':view.y++;render();break;
    case 'today':{const n=new Date();view.y=n.getFullYear();view.m=n.getMonth();render();break;}
    case 'amode':view.amode=d.m;render();break;
    case 'cview':view.cview=d.v;render();break;
    case 'togglecat':view.collapsed.has(d.cat)?view.collapsed.delete(d.cat):view.collapsed.add(d.cat);render();break;
    case 'colpick':{const rd=READS[d.id];if(rd){$('#rd-'+d.id).innerHTML=rd[+d.i]||'';document.querySelectorAll('.hit[data-id="'+d.id+'"]').forEach(x=>x.classList.toggle('sel',x.dataset.i===d.i));}break;}
    case 'edit':openForm(d.id);break;
    case 'del':{const i=state.entries.findIndex(e=>e.id===d.id);if(i>=0){lastDeleted=state.entries.splice(i,1)[0];save();render();toast('Registo apagado',true);}break;}
    case 'undo':if(lastDeleted){state.entries.push(lastDeleted);lastDeleted=null;save();render();$('#toast').classList.remove('show','act');}break;
    case 'closesheet':closeSheet();break;
    case 'fsave':saveForm(false);break;
    case 'fsaveagain':saveForm(true);break;
    case 'dtoday':$('#fdate').value=todayStr();break;
    case 'dyest':$('#fdate').value=iso(new Date(Date.now()-86400000));break;
    case 'chip':{const f=findSub(d.sub);if(!f)break;$('#fcat').innerHTML=catOptions(f.cat.id);$('#fsub').innerHTML=subOptions(f.cat.id,f.sub.id);$('#fitem').value=d.item;$('#famt').value=d.amt;fillSuggestions();$('#famt').focus();$('#famt').select();break;}
    case 'dosearch':view.sa=Object.assign({},view.sd,{limit:100});$('#sres').innerHTML=searchResults();$('#sres').scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'clearsearch':view.sd={q:'',period:'all',from:'',to:'',cat:'',sub:'',min:'',max:'',sort:'date_desc'};view.sa=null;render();break;
    case 'more':view.sa.limit=(view.sa.limit||100)+100;$('#sres').innerHTML=searchResults();break;
    case 'exportjson':exportJSON();break;
    case 'importjson':$('#importfile').click();break;
    case 'exportcsv':exportCSV(d.y);break;
    case 'mv':moveItem(d.k,d.id,+d.d);break;
    case 'newcat':openCatSheet();break;
    case 'editcat':openCatSheet(d.id);break;
    case 'newsub':openSubSheet(null,d.id);break;
    case 'editsub':openSubSheet(d.id);break;
    case 'delcat':openDelSheet('cat',d.id);break;
    case 'delsub':openDelSheet('sub',d.id);break;
    case 'pickicon':{$('#eic').value=d.ic;document.querySelectorAll('.ib').forEach(b=>b.classList.toggle('on',b===t&&!!d.ic));break;}
    case 'savecat':{
      const nm=$('#enm').value.trim();if(!nm){toast('Indique o nome');return;}
      const bud=parseMoney($('#ebud').value);if(isNaN(bud)){toast('Orçamento inválido');return;}
      const ic=$('#eic').value.trim()||'📁';
      if(ctx.id){const c=getCat(ctx.id);c.name=nm;c.icon=ic;c.budget=bud||0;}
      else state.cats.push({id:uid(),name:nm,icon:ic,color:nextColor(),budget:bud||0,subs:[]});
      save();closeSheet();render();toast('Guardado');break;}
    case 'savesub':{
      const nm=$('#enm').value.trim();if(!nm){toast('Indique o nome');return;}
      const ic=$('#eic').value.trim(),cid=$('#ecat').value,dest=getCat(cid);
      if(ctx.id){const f=findSub(ctx.id);f.sub.name=nm;f.sub.icon=ic;if(f.cat.id!==cid){f.cat.subs=f.cat.subs.filter(s=>s.id!==ctx.id);dest.subs.push(f.sub);}}
      else dest.subs.push({id:uid(),name:nm,icon:ic});
      save();closeSheet();render();toast('Guardado');break;}
    case 'delmove':{
      const to=$('#dmove').value;if(!to){toast('Escolha para onde mover os registos');return;}
      state.entries.forEach(e=>{if(ctx.subs.indexOf(e.sub)>=0)e.sub=to;});state.fixed.forEach(f=>{if(ctx.subs.indexOf(f.sub)>=0)f.sub=to;});
      removeStructure();toast('Apagado; registos movidos');break;}
    case 'delall':{
      const n=state.entries.filter(e=>ctx.subs.indexOf(e.sub)>=0).length;
      if(n&&!confirm('Apagar também '+n+' registo(s)? Esta ação não se pode desfazer.'))return;
      state.entries=state.entries.filter(e=>ctx.subs.indexOf(e.sub)<0);state.fixed=state.fixed.filter(f=>ctx.subs.indexOf(f.sub)<0);
      removeStructure();toast('Apagado');break;}
    case 'newfx':openFxSheet();break;
    case 'editfx':openFxSheet(d.id);break;
    case 'delfx':if(confirm('Apagar este modelo de despesa fixa? Os registos já lançados mantêm-se.')){state.fixed=state.fixed.filter(f=>f.id!==d.id);save();render();}break;
    case 'savefx':{
      const sub=$('#xsub').value,cents=parseMoney($('#xamt').value),day=Math.min(31,Math.max(1,parseInt($('#xday').value,10)||1));
      if(!findSub(sub)){toast('Escolha a rubrica');return;}if(cents===null||isNaN(cents)||cents<=0){toast('Valor inválido');return;}
      const o={sub:sub,item:$('#xitem').value.trim(),cents:cents,day:day};
      if(ctx.id)Object.assign(state.fixed.find(f=>f.id===ctx.id),o);else state.fixed.push(Object.assign({id:uid()},o));
      save();closeSheet();render();toast('Guardado');break;}
    case 'launchfx':openLaunch();break;
    case 'dolaunch':{
      const y=view.y,m=view.m;let n=0,bad=0;
      state.fixed.forEach(f=>{
        const cb=document.querySelector('[data-fxc="'+f.id+'"]');if(!cb||!cb.checked)return;
        const c=parseMoney(document.querySelector('[data-fxa="'+f.id+'"]').value);if(c===null||isNaN(c)||c<=0){bad++;return;}
        state.entries.push({id:uid(),date:mkey(y,m)+'-'+pad(Math.min(f.day,daysIn(y,m))),sub:f.sub,item:f.item,cents:c,ts:Date.now(),fx:f.id});n++;
      });
      if(bad){toast('Verifique os valores indicados');}
      save();closeSheet();render();toast(n+' despesa'+(n===1?'':'s')+' lançada'+(n===1?'':'s'));break;}
  }
});
function removeStructure(){
  if(ctx.kind==='cat')state.cats=state.cats.filter(c=>c.id!==ctx.id);
  else{const f=findSub(ctx.id);if(f)f.cat.subs=f.cat.subs.filter(s=>s.id!==ctx.id);}
  save();closeSheet();render();
}
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.pref){state.prefs[t.dataset.pref]=t.checked;save();render();return;}
  const c=t.dataset.chg;
  if(c==='catsel'){const p=t.dataset.p,all=t.dataset.all;$('#'+p+'sub').innerHTML=subOptions(t.value,'',all);if(p==='f')fillSuggestions();if(p==='s'){view.sd.cat=t.value;view.sd.sub='';}}
  else if(c==='fsub')fillSuggestions();
  else if(c==='focus'){view.focus=t.value;render();}
  else if(c==='period'){view.sd.period=t.value;render();}
  else if(t.dataset.sf)view.sd[t.dataset.sf]=t.value;
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.sf)view.sd[t.dataset.sf]=t.value;});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target.id==='sq'){ev.preventDefault();ev.target.blur();document.querySelector('[data-act="dosearch"]').click();}
  if(ev.key==='Escape')closeSheet();
});
$('#app').addEventListener('toggle',ev=>{
  const d=ev.target;
  if(d.dataset.cat){d.open?openCats.add(d.dataset.cat):openCats.delete(d.dataset.cat);}
  if(d.dataset.sub){d.open?openSubs.add(d.dataset.sub):openSubs.delete(d.dataset.sub);}
  if(d.dataset.ml){d.open?openSubs.add('ml'+d.dataset.ml):openSubs.delete('ml'+d.dataset.ml);}
},true);
$('#ov').addEventListener('click',ev=>{if(ev.target.id==='ov')closeSheet();});
$('#importfile').addEventListener('change',ev=>{const f=ev.target.files[0];if(f)importJSON(f);ev.target.value='';});

/* ---------- relógio ---------- */
function tick(){const d=new Date();$('#cdate').textContent=DIAS3[d.getDay()]+', '+d.getDate()+' '+MES3[d.getMonth()].toLowerCase()+' '+d.getFullYear();$('#ctime').textContent=pad(d.getHours())+':'+pad(d.getMinutes());}
tick();setInterval(tick,5000);document.addEventListener('visibilitychange',tick);

/* ---------- arranque ---------- */
load();
const now=new Date();view.y=now.getFullYear();view.m=now.getMonth();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
window.__app={get state(){return state;},render:render,view:view};
})();
</script>
